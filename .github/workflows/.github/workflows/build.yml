name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip project
        run: unzip BlogApp.zip
        
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Grant execute permission
        run: |
          cd BlogApp
          chmod +x gradlew
          
      - name: Build Debug APK
        run: |
          cd BlogApp
         ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: BlogApp/app/build/outputs/apk/debug/app-debug.apk
